# Add to your repo as .github/workflows/kiro-heal-verify.yml
# Runs the kiro-heal CLI in CI. To trigger the hosted GitHub App instead,
# send a repository_dispatch (do not POST unsigned payloads at the webhook URL).

name: Kiro Heal Verify

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  verify-cli:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       startsWith(github.event.comment.body, '/kiro-heal verify') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install kiro-heal
        run: npm ci && npm link

      - name: Run local verification pipeline (simulator if Kane is not configured)
        env:
          KIRO_HEAL_SIMULATE_KANE: '1'
          KIRO_HEAL_OPEN_PR: '0'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node demo/server.js &
          sleep 2
          kiro-heal init --dir .
          kiro-heal run --dir . --no-heal || kiro-heal run --dir .
