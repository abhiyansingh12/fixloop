name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Node 22's bundled npm is older.
      - name: Install npm 11
        run: npm install -g npm@11

      - run: npm ci

      - name: Unit + pipeline tests
        env:
          KIRO_HEAL_SIMULATE_KANE: '1'
          KIRO_HEAL_OPEN_PR: '0'
          FIXLOOP_SIMULATE: '1'
          FIXLOOP_OPEN_PR: '0'
        run: npm test

      - name: Release tag must match package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

      - name: Publish
        run: |
          # setup-node writes an empty _authToken when NPM_TOKEN is unset.
          # That blocks OIDC trusted publishing (ENEEDAUTH / 404).
          npm config delete "//registry.npmjs.org/:_authToken" || true
          npm --version
          npm publish --access public --provenance
