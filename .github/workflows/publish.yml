name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Test
        env:
          KIRO_HEAL_SIMULATE_KANE: '1'
          KIRO_HEAL_OPEN_PR: '0'
          FIXLOOP_SIMULATE: '1'
          FIXLOOP_OPEN_PR: '0'
        run: npm test

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
