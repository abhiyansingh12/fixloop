name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted Publisher (OIDC) needs Node >= 22.14 and npm >= 11.5.1
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Unit + pipeline tests
        env:
          KIRO_HEAL_SIMULATE_KANE: '1'
          KIRO_HEAL_OPEN_PR: '0'
          FIXLOOP_SIMULATE: '1'
          FIXLOOP_OPEN_PR: '0'
        run: npm test

      # OIDC via id-token: write. Do not set NODE_AUTH_TOKEN here — an empty
      # NPM_TOKEN secret would mask trusted publishing and fail auth.
      - name: Publish
        run: npm publish --access public --provenance
