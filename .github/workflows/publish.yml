name: Publish npm package

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - name: Install npm 11.5+
        run: npm install -g npm@latest

      - name: Strip empty setup-node auth token
        run: |
          # setup-node + registry-url writes
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # into $NPM_CONFIG_USERCONFIG ($RUNNER_TEMP/.npmrc). An empty
          # expansion makes npm skip OIDC and fail with ENEEDAUTH.
          # See actions/setup-node#1551 and npm/documentation#1960.
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          echo "npm $(npm --version)"
          echo "OIDC request URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"

      - run: npm ci

      - name: Unit + pipeline tests
        env:
          KIRO_HEAL_SIMULATE_KANE: '1'
          KIRO_HEAL_OPEN_PR: '0'
          FIXLOOP_SIMULATE: '1'
          FIXLOOP_OPEN_PR: '0'
        run: npm test

      - name: Tag must match package.json
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

      - name: Publish
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "fixloop@${VERSION}" version >/dev/null 2>&1; then
            echo "fixloop@${VERSION} is already on npm"
            exit 0
          fi
          npm publish --access public --provenance
