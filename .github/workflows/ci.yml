name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Unit + pipeline tests
        env:
          KIRO_HEAL_SIMULATE_KANE: '1'
          KIRO_HEAL_OPEN_PR: '0'
          FIXLOOP_SIMULATE: '1'
          FIXLOOP_OPEN_PR: '0'
        run: npm test
